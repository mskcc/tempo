name: "Get nf-test shards"
description: "Identify nf-test files and create shards for parallel execution"

outputs:
  components:
    description: "JSON array of test file shards"
    value: ${{ steps.shard.outputs.components }}
  has_changes:
    description: "Whether there are test files to run"
    value: ${{ steps.shard.outputs.has_changes }}

runs:
  using: "composite"
  steps:
    - name: Install nf-test
      shell: bash
      run: |
        wget -qO- https://code.askimed.com/install/nf-test | bash -s -- --version 0.9.2
        sudo mv nf-test /usr/local/bin/

    - name: List and shard nf-test files
      id: shard
      shell: bash
      run: |
        # List all nf-test files
        nf-test list --dry-run 2>/dev/null | grep '\.nf\.test$' > test_files.txt || true

        if [ ! -s test_files.txt ]; then
          echo "components=[]" >> $GITHUB_OUTPUT
          echo "has_changes=false" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Create JSON array of test files
        COMPONENTS=$(cat test_files.txt | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "components=${COMPONENTS}" >> $GITHUB_OUTPUT
        echo "has_changes=true" >> $GITHUB_OUTPUT
