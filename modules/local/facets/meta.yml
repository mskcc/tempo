name: "facets"
description: FACETS copy number analysis from SNP pileup
keywords:
  - copy-number
  - cnv
  - facets
tools:
  - facets:
      description: FACETS - Fraction and Allele Specific Copy Number Estimate from Tumor and Stroma
      homepage: "https://github.com/mskcc/facets"
      documentation: "https://github.com/mskcc/facets"
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', tumor_id:'tumor1', normal_id:'normal1' ]`
  - - snp_pileup:
        type: file
        description: SNP pileup file from snp-pileup
        pattern: "*.snp_pileup.gz"
output:
  - rdata:
      - - meta:
            type: map
            description: Sample metadata
      - - "*.Rdata":
            type: file
            description: FACETS R data object with copy number results
            pattern: "*.Rdata"
  - plots:
      - - meta:
            type: map
            description: Sample metadata
      - - "*.png":
            type: file
            description: Diagnostic plots (optional)
            pattern: "*.png"
  - out_files:
      - - meta:
            type: map
            description: Sample metadata
      - - "*.out":
            type: file
            description: Summary output files (optional)
            pattern: "*.out"
  - segments:
      - - meta:
            type: map
            description: Sample metadata
      - - "*.seg":
            type: file
            description: Segment files with copy number calls (optional)
            pattern: "*.seg"
  - txt_files:
      - - meta:
            type: map
            description: Sample metadata
      - - "*.txt":
            type: file
            description: Text output files (optional)
            pattern: "*.txt"
  - csv_files:
      - - meta:
            type: map
            description: Sample metadata
      - - "*.csv":
            type: file
            description: CSV output files (optional)
            pattern: "*.csv"
  - versions:
      - - "versions.yml":
            type: file
            description: File containing software versions
            pattern: "versions.yml"
authors:
  - "@mskcc"
maintainers:
  - "@mskcc"
