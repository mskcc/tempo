# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gatk4_setnmmdanduqtags"
description: "This tool takes in a coordinate-sorted SAM or BAM and calculatesthe
  NM, MD, and UQ tags by comparing with the reference."
keywords:
  - bam
  - uq
  - nm
  - md
tools:
  - gatk4:
      description: Developed in the Data Sciences Platform at the Broad Institute, the
        toolkit offers a wide variety of tools with a primary focus on variant discovery
        and genotyping. Its powerful processing engine and high-performance computing
        features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/articles/360037052812-MarkDuplicates-Picard-
      tool_dev_url: https://github.com/broadinstitute/gatk
      doi: 10.1158/1538-7445.AM2017-3590
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - bam:
        type: file
        description: Sorted BAM/SAM file
        pattern: "*.{bam,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_2572"
          - edam: "http://edamontology.org/format_2573"
    - bai:
        type: file
        description: Sorted BAM/SAM file index
        pattern: "*.{bai}"
        ontologies:
          - edam: "http://edamontology.org/format_2572"
          - edam: "http://edamontology.org/format_2573"
    - interval_list:
        type: file
        description: Interval List file
        pattern: "*.{interval_list}"
  - - reference:
        type: file
        description: Reference fasta file
        pattern: "*.{fasta,fa}"
        ontologies:
          - edam: "http://edamontology.org/format_1929"
  - - reference_index:
        type: file
        description: Reference fasta file index
        pattern: "*.{fai}"
        ontologies:
          - edam: "http://edamontology.org/format_1929"
  - - reference_dict:
        type: file
        description: Reference fasta file dictionary
        pattern: "*.{dict}"
        ontologies:
          - edam: "http://edamontology.org/format_1929"


output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.bam":
          type: file
          description: Sorted BAM file
          pattern: "*.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572"
      - "*.bai":
          type: file
          description: BAM indexing file
          pattern: "*.bai"
          ontologies:
            - edam: "http://edamontology.org/format_3327"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"

        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@anoronh4"
  - "@gongyixiao"
maintainers:
  - "@anoronh4"
  - "@gongyixiao"
