name: "somatic_merge_sv"
description: Merge DELLY and Manta somatic structural variant calls
keywords:
  - somatic
  - structural-variants
  - delly
  - manta
  - merge
tools:
  - bcftools:
      description: VCF filtering and manipulation
      homepage: "https://samtools.github.io/bcftools/"
      documentation: "https://samtools.github.io/bcftools/"
      licence: ["MIT"]
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', tumor_id:'tumor1', normal_id:'normal1' ]`
  - - delly_vcf:
        type: file
        description: DELLY VCF file
        pattern: "*.vcf.gz"
  - - delly_tbi:
        type: file
        description: DELLY VCF index file
        pattern: "*.vcf.gz.tbi"
  - - manta_vcf:
        type: file
        description: Manta VCF file
        pattern: "*.vcf.gz"
  - - manta_tbi:
        type: file
        description: Manta VCF index file
        pattern: "*.vcf.gz.tbi"
output:
  - vcf:
      - - meta:
            type: map
            description: Sample metadata
      - - "*.delly.manta.vcf.gz":
            type: file
            description: Merged DELLY and Manta VCF file
            pattern: "*.delly.manta.vcf.gz"
      - - "*.delly.manta.vcf.gz.tbi":
            type: file
            description: Index of merged VCF file
            pattern: "*.delly.manta.vcf.gz.tbi"
  - versions:
      - - "versions.yml":
            type: file
            description: File containing software versions
            pattern: "versions.yml"
authors:
  - "@mskcc"
maintainers:
  - "@mskcc"
